<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Stock News Digest{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="{% if username is defined and username %}/{{ username }}{% else %}/{% endif %}" class="text-xl font-bold text-indigo-600">Stock News Digest</a>
            <div class="flex items-center gap-4">
                {% if username is defined and username %}
                <span class="text-sm text-gray-600">{{ username }}</span>
                <a href="/" class="text-sm text-gray-400 hover:text-gray-600">Switch user</a>
                {% else %}
                <span class="text-sm text-gray-500">Cached news for tracked stocks</span>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="max-w-6xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
